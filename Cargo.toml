[[bin]]
name = "npwg"
path = "src/main.rs"

[package]
name = "npwg"
version = "0.5.3"
edition = "2021"
license = "MIT"
authors = ["Volker Schwaberow <volker@schwaberow.de>"]
description = "Securely generate random passwords"
repository = "https://github.com/vschwaberow/npwg"

[lib]
name = "npwg"
path = "src/lib.rs"

[dependencies]
zeroize = "1.9.0"
dirs = "7.0.0"
colored = "3.1.1"
thiserror = "2.0.20"
dialoguer = "0.12.0"
console = "0.16.4"
sha2 = "0.11"
toml = "1.1"
qrcodegen = "1.8.0"
argon2 = "0.6.0"
sha1 = "0.11.0"
serde_json = "1.0.151"
clap_complete = "4.6.9"

[dev-dependencies]
tempfile = "3.27"

[dependencies.rand]
version = "0.10.2"
features = ["std"]

[dependencies.clap]
version = "4.6.6"
features = ["cargo", "env", "derive"]

[dependencies.tokio]
version = "1.53.1"
features = ["rt-multi-thread", "macros"]

[dependencies.reqwest]
version = "0.13.4"
features = ["rustls"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.arboard]
version = "3.6.1"
features = ["wl-clipboard-rs"]

[profile.release]
opt-level = 3
debug = false
strip = true
lto = false
