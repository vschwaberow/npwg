name: Release

permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: npwg-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: npwg-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: npwg-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: mv "target/${{ matrix.target }}/release/npwg.exe" "${{ matrix.artifact }}"

      - name: Stage binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: mv "target/${{ matrix.target }}/release/npwg" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
